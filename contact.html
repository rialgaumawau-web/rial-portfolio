<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Contact Me - Rial Mawau</title>
    <meta name="viewport" content="width=device-width">
    <link rel="stylesheet" type="text/css" href="desktop.css" media="only screen and (min-width:960px)">
    <link rel="stylesheet" type="text/css" href="tablet.css" media="only screen and (min-width:481px) and (max-width:960px)">
    <link rel="stylesheet" type="text/css" href="mobile.css" media="only screen and (max-width:480px)">
</head>

<body>
<header id="banner">
    <h1>Contact Me</h1>
</header>

<section id="contact-section">
    <form>
        <label>Name:</label>
        <input type="text" name="name" required>

        <label>Email:</label>
        <input type="email" name="email" required>

        <label>Cell No.:</label>
        <input type="tel" name="phone" pattern="[0-9]{10}" required>

        <label>Comments:</label>
        <textarea name="comments" required></textarea>

        <label>What is 2 + 2?</label>
        <input type="text" name="robot-check" required>

        <button type="submit">Submit</button>
    </form>
</section>

<footer id="footer">
    <p>Contact: rialgaumawau@gmail.com</p>
    <p>&copy; 2026 Rial Mawau</p>
</footer>
</body>
</html>
